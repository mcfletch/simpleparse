[tox]
requires =
    tox>=4.11
    tox-uv>=1
envlist=typecheck,py38,py39,py310,py311,py312,py313,py314
skip_missing_interpreters = True
toxworkdir={toxinidir}/../simpleparse-tox


[testenv]
runner = uv-venv-runner
deps=pytest
usedevelop=true
commands=pytest {posargs:tests}

# What this package declares, checked as a consumer's checker reads it -- the
# tag-table commands and the C extension's own surface included, since neither
# is stated in any Python source.  In `envlist`: a gate nothing runs is a gate
# that stops being true.
[testenv:typecheck]
skip_install = true
deps =
    mypy
commands = mypy
