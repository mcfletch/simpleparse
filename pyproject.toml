[build-system]
requires = ["setuptools>=59.6", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simpleparse"
dynamic = ["version"]
description = "A Parser Generator for Python (w/mxTextTools derivative)"
authors = [
    {name = "Mike C. Fletcher", email = "mcfletch@users.sourceforge.net"},
]
readme = "README.md"
license = {text = "BSD-3-Clause"}
keywords = ["parse", "parser", "parsing", "text", "ebnf", "grammar", "generator"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"

[project.optional-dependencies]
dev = ["pytest", "ruff", "tox>=4.11", "tox-uv>=1"]
docs = ["sphinx", "sphinx-rtd-theme"]

[project.urls]
Homepage = "https://mcfletch.github.io/simpleparse/"
Source = "https://github.com/mcfletch/simpleparse"

[tool.setuptools]
packages = [
    "simpleparse",
    "simpleparse.common",
    "simpleparse.stt",
    "simpleparse.stt.Doc",
    "simpleparse.stt.TextTools",
    "simpleparse.stt.TextTools.Constants",
    "simpleparse.stt.TextTools.mxTextTools",
    "simpleparse.xmlparser",
]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "simpleparse.__version__"}

[tool.setuptools.package-data]
# `py.typed` and the stubs beside the C extension: what a consumer's
# checker reads about the tagging engine, which has no Python source.
simpleparse = ["py.typed", "**/*.pyi", "*.txt", "**/*.txt", "**/*.ebnf", "**/*.html", "**/*.pyx", "**/*.h", "**/*.def"]

[tool.ruff.format]
quote-style="preserve"

[tool.ruff]
# Character-set constants, and the characters are the point: the module says
# `# -*- coding: latin-1 -*-` and holds high bytes deliberately. It imports
# correctly; ruff reads every file as UTF-8 and cannot open this one.
extend-exclude = ["simpleparse/stt/TextTools/Constants/Sets.py"]

[tool.ruff.lint]
# Named explicitly. With `select` unset ruff applies its own default, and that
# default has widened between releases -- a gate whose meaning moves when a
# tool is upgraded is not a gate. This says what the project holds itself to.
select = ["E", "W", "F", "B"]
# `_`, `err`, and the conventional `_name`: an underscore prefix is how Python
# says a name is bound but deliberately unused.
dummy-variable-rgx = "^(_[a-zA-Z0-9_]*|err)$"
ignore = [
    'D200', # Allow multiline docstring even when it could fit on one line

    'C408', # Allow instantiating dictionary as dict(key=value)
    'E501', # Line too long
    'PTH', # allow os.path
    'PLR0913', # allow "too many" arguments

    'E401', # I prefer multiple imports/line generally
    'E402', # We often need to run setupdefaults to get django setup done
    'F401', # unused imports, not an error, but should be cleaned up

    # The generator's namespaces are built by `from x import *`, which is what
    # a parser generator's output does; the names are there at run time.
    'F403',
    'F405',
    # Whitespace, accumulated since 2001. Putting it right is a deliberate pass
    # of its own rather than something a release gate forces into an unrelated
    # change.
    'W291',
    'W293',
    'W292',

    # `l` and `r` are the left and right bounds of a match in the tag tuple
    # `(tag, l, r, subtags)` that the engine passes everywhere. The single
    # letters are the vocabulary of that structure, not carelessness.
    'E741',
]

# uv decides whether its cached metadata for a source tree is still current
# from pyproject.toml, setup.py and setup.cfg alone. This project's version
# lives in simpleparse/__init__.py, so name that file too: without it a version
# bump leaves uv answering with the previous number, and a dependent requiring
# the new one resolves against PyPI rather than this checkout.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "simpleparse/__init__.py" }]

# The package's own declarations, checked as a consumer's checker reads them.
# `check_untyped_defs` rather than `disallow_untyped_defs`: this package is
# older than annotations, and its *bodies* being checked is the half that finds
# defects -- the other half is a job of its own.
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
